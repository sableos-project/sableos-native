# SableOS Native's own Rust workspace (sable-hubd, -framesd, -inputd,
# -searchd, -settings). Kept apart from Marathon's crates/ workspace so that
# merges from upstream never touch our manifests. Lints follow Marathon's
# table (Shipwright's set) so code moves between the two without churn.
[workspace]
resolver = "2"
members = ["sable-settings"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
unwrap_used = "warn"
expect_used = "warn"
unwrap_in_result = "warn"
get_unwrap = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
map_err_ignore = "warn"
clone_on_ref_ptr = "warn"
let_underscore_must_use = "warn"
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
redundant_clone = "warn"
needless_collect = "warn"
or_fun_call = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
overflow-checks = true
strip = "symbols"
