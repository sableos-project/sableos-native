# cargo-deny policy for SableOS Native's Rust workspace.
# Run: cd sable/crates && cargo deny check
# CI: .github/workflows/sable-security.yml

[graph]
all-features = true

# Known vulnerabilities and unmaintained crates (RustSec advisory database).
[advisories]
version = 2
yanked = "deny"
ignore = []

# Every dependency's licence must be compatible with shipping Apache-2.0
# binaries that are linked statically. Copyleft licences (GPL, LGPL, MPL, AGPL)
# are not on the list: a crate under one needs a deliberate exception here.
[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# One version of each crate where possible; no wildcard version requirements.
[bans]
multiple-versions = "warn"
wildcards = "deny"

# Only crates.io; no git or other registries without review.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
